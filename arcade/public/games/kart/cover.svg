<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82e0"/>
      <stop offset="1" stop-color="#a9dcff"/>
    </linearGradient>
    <pattern id="check" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#58b752"/>
      <rect width="8" height="8" fill="#4fae4a"/>
      <rect x="8" y="8" width="8" height="8" fill="#4fae4a"/>
    </pattern>
    <pattern id="flag" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#fff"/>
      <rect width="6" height="6" fill="#111"/>
      <rect x="6" y="6" width="6" height="6" fill="#111"/>
    </pattern>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <!-- nuvens -->
  <g fill="#fff">
    <circle cx="50" cy="28" r="10"/><circle cx="64" cy="24" r="13"/><circle cx="78" cy="29" r="9"/>
    <circle cx="240" cy="20" r="8"/><circle cx="252" cy="17" r="11"/><circle cx="265" cy="21" r="8"/>
  </g>
  <!-- montanhas -->
  <path d="M0 78 L40 52 L80 70 L130 40 L180 68 L230 46 L280 66 L320 50 L320 86 L0 86 Z" fill="#7aa0d8"/>
  <path d="M0 86 Q40 70 80 84 T160 82 T240 80 T320 82 L320 92 L0 92 Z" fill="#2f7a43"/>
  <!-- grama -->
  <rect y="90" width="320" height="110" fill="url(#check)"/>
  <!-- pista em perspectiva -->
  <path d="M138 90 L182 90 L330 200 L-10 200 Z" fill="#c9a463"/>
  <path d="M142 90 L178 90 L310 200 L10 200 Z" fill="#e8352e"/>
  <path d="M146 90 L174 90 L292 200 L28 200 Z" fill="#6d6d78"/>
  <!-- linha de chegada -->
  <path d="M110 150 L210 150 L218 160 L102 160 Z" fill="url(#flag)"/>
  <!-- árvores -->
  <g>
    <rect x="40" y="96" width="5" height="16" fill="#6b4423"/><circle cx="42" cy="92" r="12" fill="#278c3a"/><circle cx="41" cy="84" r="8" fill="#35a848"/>
    <rect x="272" y="100" width="6" height="18" fill="#6b4423"/><circle cx="275" cy="95" r="14" fill="#278c3a"/><circle cx="274" cy="86" r="9" fill="#35a848"/>
  </g>
  <!-- kart rival -->
  <g transform="translate(176 112)">
    <ellipse cx="14" cy="17" rx="15" ry="3" fill="rgba(0,0,0,.3)"/>
    <rect x="0" y="9" width="7" height="8" fill="#1d1d22"/><rect x="21" y="9" width="7" height="8" fill="#1d1d22"/>
    <rect x="4" y="7" width="20" height="7" fill="#1e88e5"/>
    <rect x="9" y="1" width="10" height="7" fill="#f5f5f5"/>
    <circle cx="14" cy="-2" r="5" fill="#ffd3a3"/><path d="M9 -3 A5 5 0 0 1 19 -3 Z" fill="#1e88e5"/>
  </g>
  <!-- kart do jogador -->
  <g transform="translate(118 140)">
    <ellipse cx="42" cy="50" rx="46" ry="7" fill="rgba(0,0,0,.35)"/>
    <rect x="0" y="26" width="20" height="24" fill="#1d1d22"/><rect x="64" y="26" width="20" height="24" fill="#1d1d22"/>
    <rect x="10" y="20" width="64" height="20" fill="#e53935"/>
    <rect x="6" y="34" width="72" height="8" fill="#7e1f1d"/>
    <rect x="28" y="4" width="28" height="20" fill="#2b2b30"/>
    <rect x="30" y="0" width="24" height="14" fill="#1e3a8a"/>
    <circle cx="42" cy="-8" r="14" fill="#ffd3a3"/>
    <path d="M28 -9 A14 14 0 0 1 56 -9 Z" fill="#e53935"/>
  </g>
  <!-- faíscas de drift -->
  <g fill="#ff9d1a"><rect x="108" y="186" width="4" height="4"/><rect x="102" y="180" width="3" height="3"/><rect x="206" y="184" width="4" height="4"/><rect x="213" y="178" width="3" height="3"/></g>
  <g fill="#4fc3ff"><rect x="98" y="190" width="3" height="3"/><rect x="218" y="189" width="3" height="3"/></g>
</svg>
