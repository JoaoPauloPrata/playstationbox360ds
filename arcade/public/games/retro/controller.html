<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#08060f">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PSBox360DS">
  <title>Controle · Emulador</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08060f; --ink: #fff; --muted: #a9a3d6; --accent: #ffd400; --me: #e53935; --sys: #6a4bc4;
      --pixel: 'Press Start 2P', ui-monospace, monospace; --body: 'VT323', ui-monospace, monospace;
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; }
    body {
      background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--sys) 45%, #000), var(--bg) 72%); color: var(--ink); font-family: var(--pixel);
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    header { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 9px; background: rgba(0,0,0,.45); border-bottom: 3px solid #000; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #888; flex: none; }
    .dot.ok { background: #2ecc71; } .dot.wait { background: var(--accent); } .dot.error { background: #e74c3c; }
    .badge { padding: 5px 7px; border: 2px solid #000; color: #000; background: var(--me); }
    #gname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); min-width: 0; }
    .grow { flex: 1; }
    header button { font: inherit; font-size: 8px; color: #fff; background: #2a2050; border: 2px solid #fff; padding: 6px 8px; border-radius: 4px; flex: none; }

    /* ---------- controle ---------- */
    main { flex: 1; position: relative; display: grid; grid-template-columns: 1fr auto 1.15fr; grid-template-rows: auto 1fr; min-height: 0; padding: 8px 14px 12px; gap: 6px 10px; }
    .sh { display: flex; gap: 8px; }
    .sh.r { justify-content: flex-end; grid-column: 3; }
    .sh.l { grid-column: 1; }
    .sh .btn { border-radius: 10px; min-width: 64px; height: 38px; padding: 0 12px; background: #3a3260; color: #fff; font-size: 11px; }

    #dpad { grid-column: 1; grid-row: 2; position: relative; display: grid; place-items: center; }
    .cross { position: relative; width: min(100%, 44vh, 210px); aspect-ratio: 1; }
    .cross i { position: absolute; background: #23203a; border: 4px solid #000; box-shadow: 0 5px 0 rgba(0,0,0,.6); }
    .cross .v { left: 33%; width: 34%; top: 0; height: 100%; border-radius: 10px; }
    .cross .h { top: 33%; height: 34%; left: 0; width: 100%; border-radius: 10px; }
    .cross .c { left: 33%; top: 33%; width: 34%; height: 34%; border: 0; box-shadow: none; background: #23203a; }
    .cross b { position: absolute; color: rgba(255,255,255,.4); font-size: 14px; transform: translate(-50%, -50%); transition: color .05s; }
    .cross b.on { color: var(--accent); text-shadow: 0 0 10px var(--accent); }
    .cross .u { left: 50%; top: 16%; } .cross .d { left: 50%; top: 84%; } .cross .lf { left: 16%; top: 50%; } .cross .rt { left: 84%; top: 50%; }
    .cross .knob { position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; margin: -15% 0 0 -15%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #bdb6e6); box-shadow: 0 3px 0 #000; transition: transform .04s; display: none; }
    .stick .cross i { display: none; }
    .stick .cross { border-radius: 50%; border: 4px solid rgba(255,255,255,.3); background: rgba(255,255,255,.05); }
    .stick .cross .knob { display: block; }

    #mid { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 14px; padding-bottom: 6px; }
    #mid .btn { border-radius: 20px; height: 30px; min-width: 76px; padding: 0 10px; background: #3a3a48; color: #ddd; font-size: 8px; }
    #mid .sysname { font-size: 8px; color: var(--muted); text-align: center; line-height: 1.6; max-width: 120px; }

    #face { grid-column: 3; grid-row: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; }
    .row { display: flex; gap: 12px; justify-content: center; }
    .row:last-child { transform: translateX(-6%); }
    .diamond { display: grid; grid-template-columns: repeat(3, auto); grid-template-rows: repeat(3, auto); gap: 0; }
    .diamond .btn:nth-child(1) { grid-area: 1 / 2; } .diamond .btn:nth-child(2) { grid-area: 2 / 1; }
    .diamond .btn:nth-child(3) { grid-area: 2 / 3; } .diamond .btn:nth-child(4) { grid-area: 3 / 2; }
    .btn {
      --s: min(17vh, 82px);
      width: var(--s); height: var(--s); border-radius: 50%; border: 4px solid #000; background: var(--c, #e53935); color: #fff;
      font: inherit; font-size: clamp(11px, 3vh, 16px); text-shadow: 2px 2px 0 rgba(0,0,0,.6);
      display: grid; place-items: center; box-shadow: 0 6px 0 rgba(0,0,0,.65), inset 0 -5px 0 rgba(0,0,0,.25);
    }
    .small .btn { --s: min(12vh, 58px); font-size: clamp(9px, 2.3vh, 12px); }
    .btn.down { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.6), inset 0 4px 0 rgba(0,0,0,.25); filter: brightness(1.3); }

    /* ---------- telas por cima ---------- */
    .screen { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: rgba(8,6,15,.97); padding: 12px 16px; text-align: center; }
    .screen.hidden { display: none; }
    .screen h1 { margin: 0; font-size: clamp(13px, 3.2vw, 20px); color: var(--accent); text-shadow: 3px 3px 0 #b8417a; line-height: 1.5; }
    .screen p { margin: 0; font-family: var(--body); font-size: 20px; color: var(--muted); max-width: 520px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(100%, 520px); }
    .cta { font: inherit; font-size: clamp(10px, 2.4vw, 13px); padding: 14px 12px; background: #2ecc71; color: #000; border: 4px solid #000; border-radius: 12px; box-shadow: 0 5px 0 #000; }
    .cta.alt { background: var(--accent); } .cta.blue { background: #29b6f6; } .cta.red { background: #ff7043; }
    .cta.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); box-shadow: none; font-size: 10px; }
    .cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #000; }
    .blink { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .35; } }

    #toast { position: fixed; left: 50%; top: 46px; transform: translate(-50%, -160%); z-index: 30; background: #000; border: 3px solid var(--accent);
      padding: 10px 14px; font-size: 9px; transition: transform .25s, opacity .25s; pointer-events: none; opacity: 0; }
    #toast.show { transform: translate(-50%, 0); opacity: 1; }

    #rotate { display: none; }
    @media (orientation: portrait) { #rotate { display: flex; z-index: 20; } }
  </style>
</head>
<body>
  <header>
    <span class="dot wait" id="dot"></span>
    <span id="status">Conectando...</span>
    <span class="badge" id="badge" hidden>P1</span>
    <span id="gname"></span>
    <span class="grow"></span>
    <button id="menu">☰ MENU</button>
  </header>

  <main id="pad">
    <div class="sh l" id="shL"></div>
    <div class="sh r" id="shR"></div>
    <div id="dpad">
      <div class="cross" id="cross">
        <i class="v"></i><i class="h"></i><i class="c"></i>
        <b class="u">▲</b><b class="d">▼</b><b class="lf">◀</b><b class="rt">▶</b>
        <div class="knob" id="knob"></div>
      </div>
    </div>
    <div id="mid"><div class="sysname" id="sysname"></div></div>
    <div id="face"></div>

    <div class="screen" id="loadScreen">
      <h1 id="loadTitle">CARREGANDO...</h1>
      <p id="loadText" class="blink">Abrindo o jogo na TV</p>
    </div>

    <div class="screen hidden" id="errScreen">
      <h1 id="errTitle">OPS!</h1>
      <p id="errText"></p>
      <button class="cta ghost" data-cmd="exit">◀ VOLTAR À GALERIA</button>
    </div>

    <div class="screen hidden" id="menuScreen">
      <h1>MENU</h1>
      <div class="grid2">
        <button class="cta alt" data-cmd="pause" id="pauseBtn">⏸ PAUSAR</button>
        <button class="cta blue" data-cmd="reset">↻ REINICIAR</button>
        <button class="cta" data-cmd="save">💾 SALVAR JOGO</button>
        <button class="cta blue" data-cmd="load">📂 CARREGAR</button>
      </div>
      <div class="grid2">
        <button class="cta red" data-cmd="exit">◀ GALERIA</button>
        <button class="cta ghost" id="closeMenu">✕ FECHAR</button>
      </div>
    </div>
  </main>

  <div id="toast"></div>

  <div class="screen" id="rotate">
    <div style="font-size:50px">📱</div>
    <h1>GIRE O CELULAR</h1>
    <p>O controle funciona na horizontal.</p>
  </div>

  <script src="/shared/config.js"></script>
  <script src="/shared/arcade-controller.js"></script>
  <script src="/shared/retro-systems.js"></script>
  <script src="controller.js"></script>
</body>
</html>
