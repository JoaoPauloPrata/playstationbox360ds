<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emulador · playstationbox360ds</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000; --panel: rgba(12, 10, 40, .92); --ink: #fff; --muted: #a9a3d6; --accent: #ffd400; --pink: #ff3d8b;
      --pixel: 'Press Start 2P', ui-monospace, monospace; --body: 'VT323', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--pixel); }
    #game { position: fixed; inset: 0; }

    /* faixa de cima: jogadores + código da sala (some sozinha) */
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 30; display: flex; align-items: center; gap: 10px;
      background: rgba(0,0,0,.75); border: 3px solid #fff; padding: 8px 10px; font-size: 10px;
      transition: opacity .6s; pointer-events: none;
    }
    #hud.dim { opacity: 0; }
    #hud .code { color: var(--accent); letter-spacing: 3px; }
    .chip { padding: 5px 7px; border: 2px solid #000; color: #000; }
    .chip.off { opacity: .4; }

    .overlay {
      position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #1d1550, #050410 70%);
    }
    .overlay.hidden { display: none; }
    .panel {
      background: var(--panel); border: 4px solid #fff; box-shadow: 0 0 0 4px #000, 8px 8px 0 4px rgba(0,0,0,.5);
      padding: clamp(18px, 3vw, 36px); text-align: center; max-width: min(92vw, 760px);
      display: flex; flex-direction: column; gap: 18px; align-items: center;
    }
    .panel .ic { font-size: clamp(40px, 7vw, 80px); }
    .panel h1 { margin: 0; font-size: clamp(16px, 2.6vw, 30px); color: var(--accent); text-shadow: 3px 3px 0 var(--pink), 5px 5px 0 #000; line-height: 1.4; }
    .panel p { margin: 0; font-family: var(--body); font-size: clamp(20px, 2.4vw, 30px); color: var(--muted); line-height: 1.1; }
    .panel .sys { font-size: clamp(9px, 1vw, 12px); padding: 6px 8px; border: 2px solid currentColor; color: #29e0ff; }
    .panel button { font: inherit; font-size: 12px; padding: 14px 18px; background: var(--accent); color: #000; border: 4px solid #000; box-shadow: 0 5px 0 #000; cursor: pointer; }
    .blink { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .25; } }

    #sound {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 35;
      background: #000; border: 3px solid var(--accent); padding: 12px 16px; font-size: 11px; cursor: pointer;
    }
    #sound.hidden { display: none; }
    #toast {
      position: fixed; left: 50%; top: 18px; transform: translate(-50%, calc(-100% - 40px)); z-index: 45;
      background: #000; border: 3px solid var(--accent); padding: 12px 16px; font-size: 11px; transition: transform .3s;
    }
    #toast.show { transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="hud"><span>📱 SALA</span><span class="code" id="code">----</span><span id="chips"></span></div>

  <div class="overlay" id="ov">
    <div class="panel">
      <div class="ic" id="ovIc">👾</div>
      <h1 id="ovTitle">CARREGANDO...</h1>
      <span class="sys" id="ovSys" hidden></span>
      <p id="ovText">Abrindo a ROM...</p>
      <button id="ovBtn" hidden>◀ VOLTAR À GALERIA</button>
    </div>
  </div>

  <div id="sound" class="hidden">🔇 CLIQUE OU APERTE UMA TECLA NA TV PARA LIGAR O SOM</div>
  <div id="toast"></div>

  <script src="/shared/config.js"></script>
  <script src="/shared/arcade-screen.js"></script>
  <script src="/shared/retro-systems.js"></script>
  <script src="/shared/rom-library.js"></script>
  <script src="screen.js"></script>
</body>
</html>
