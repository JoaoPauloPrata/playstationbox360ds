<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>playstationbox360ds</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0820;
      --bg2: #160f3a;
      --ink: #ffffff;
      --muted: #a9a3d6;
      --accent: #ffd400;
      --pink: #ff3d8b;
      --cyan: #29e0ff;
      --panel: rgba(16, 12, 48, 0.86);
      --pixel: 'Press Start 2P', ui-monospace, monospace;
      --body: 'VT323', ui-monospace, monospace;
      --u: min(1vw, 1.78vh); /* unidade que escala com a tela 16:9 */
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); }
    body {
      background:
        radial-gradient(ellipse at 50% 120%, rgba(255, 61, 139, .35), transparent 60%),
        radial-gradient(ellipse at 50% -20%, rgba(41, 224, 255, .18), transparent 55%),
        linear-gradient(var(--bg2), var(--bg));
    }
    /* chão quadriculado em perspectiva */
    .floor {
      position: fixed; left: -50%; right: -50%; bottom: -10%; height: 55%;
      background-image:
        linear-gradient(rgba(255, 61, 139, .45) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 61, 139, .45) 2px, transparent 2px);
      background-size: 80px 80px;
      transform: perspective(400px) rotateX(62deg);
      transform-origin: bottom;
      animation: floor 2.4s linear infinite;
      mask-image: linear-gradient(transparent, #000 60%);
      -webkit-mask-image: linear-gradient(transparent, #000 60%);
      pointer-events: none;
    }
    @keyframes floor { to { background-position: 0 80px, 0 0; } }
    .scan { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.18) 3px 4px); z-index: 50; }

    .app {
      position: relative; z-index: 1; height: 100%;
      display: grid; grid-template-rows: auto 1fr auto;
      padding: calc(var(--u) * 2.2) calc(var(--u) * 3);
      gap: calc(var(--u) * 1.6);
    }

    /* ---------- topo ---------- */
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .logo {
      font-family: var(--pixel); font-size: calc(var(--u) * 2.9); margin: 0; letter-spacing: 1px; line-height: 1.25;
      text-shadow: 3px 3px 0 #000, 5px 5px 0 rgba(0,0,0,.45);
    }
    .logo .w1 { color: var(--accent); } .logo .w2 { color: var(--pink); } .logo .w3 { color: var(--cyan); } .logo .w4 { color: #3ddc84; }
    .logo small { display: block; font-size: .4em; color: var(--muted); text-shadow: 2px 2px 0 #000; letter-spacing: 3px; margin-top: 1.1em; }

    .join {
      display: flex; align-items: center; gap: calc(var(--u) * 1.4);
      background: var(--panel); border: 3px solid #fff; box-shadow: 0 0 0 3px #000, 6px 6px 0 3px rgba(0,0,0,.5);
      padding: calc(var(--u) * 1);
    }
    .qr { background: #fff; padding: 6px; line-height: 0; }
    .qr img, .qr .ph { width: calc(var(--u) * 11); height: calc(var(--u) * 11); image-rendering: pixelated; }
    .qr .ph { display: grid; place-items: center; color: #333; font-family: var(--pixel); font-size: 8px; text-align: center; line-height: 1.6; }
    .join .txt { font-size: calc(var(--u) * 1.9); line-height: 1.15; color: var(--muted); }
    .join .code { font-family: var(--pixel); color: var(--accent); font-size: calc(var(--u) * 2.6); letter-spacing: 5px; margin: .25em 0; }
    .join .url { font-size: calc(var(--u) * 1.35); color: var(--cyan); word-break: break-all; max-width: calc(var(--u) * 26); }

    /* ---------- galeria ---------- */
    main { display: grid; grid-template-columns: 1.55fr 1fr; gap: calc(var(--u) * 2.4); min-height: 0; }
    .shelf { display: flex; flex-direction: column; min-height: 0; }
    .shelf h2, .detail h2 {
      font-family: var(--pixel); font-size: calc(var(--u) * 1.15); color: var(--muted); margin: 0 0 calc(var(--u) * 1.2); letter-spacing: 2px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 1.6);
      align-content: start; padding: 8px 8px 14px; overflow-y: auto; scrollbar-width: none; min-height: 0;
    }
    .grid::-webkit-scrollbar { display: none; }
    .card {
      position: relative; aspect-ratio: 16 / 10; border: 4px solid #000; background: #222 center / cover no-repeat;
      box-shadow: 0 0 0 3px rgba(255,255,255,.25), 6px 6px 0 rgba(0,0,0,.55);
      cursor: pointer; transition: transform .15s, box-shadow .15s, filter .15s;
      filter: saturate(.7) brightness(.8);
      overflow: hidden;
    }
    .card .name {
      position: absolute; left: 0; right: 0; bottom: 0; padding: calc(var(--u) * .9) calc(var(--u) * 1.1);
      font-family: var(--pixel); font-size: calc(var(--u) * 1.25); background: linear-gradient(transparent, rgba(0,0,0,.85));
      text-shadow: 2px 2px 0 #000;
    }
    .card .icon { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--u) * 8); }
    .card .sys {
      position: absolute; top: calc(var(--u) * .9); left: calc(var(--u) * .9); font-family: var(--pixel); font-size: calc(var(--u) * .8);
      background: rgba(0,0,0,.75); color: var(--cyan); padding: 5px 7px; border: 2px solid currentColor;
    }
    .card.sel {
      transform: translateY(-6px) scale(1.03); filter: none;
      box-shadow: 0 0 0 4px var(--accent), 0 0 32px 6px rgba(255, 212, 0, .45), 8px 10px 0 rgba(0,0,0,.6);
      animation: glow 1.1s ease-in-out infinite alternate;
    }
    @keyframes glow { to { box-shadow: 0 0 0 4px var(--pink), 0 0 40px 10px rgba(255, 61, 139, .5), 8px 10px 0 rgba(0,0,0,.6); } }
    .card.sel::after {
      content: '▶ JOGAR'; position: absolute; top: calc(var(--u) * .9); right: calc(var(--u) * .9);
      font-family: var(--pixel); font-size: calc(var(--u) * .95); background: var(--accent); color: #000; padding: 6px 8px; border: 3px solid #000;
    }
    .card.soon {
      cursor: default; display: grid; place-items: center; text-align: center; background: repeating-linear-gradient(45deg, #1a1540 0 14px, #140f33 14px 28px);
      font-family: var(--pixel); font-size: calc(var(--u) * 1); color: var(--muted); line-height: 2; filter: none;
      border-style: dashed; border-color: rgba(255,255,255,.3); box-shadow: none;
    }
    .card.add { cursor: pointer; align-content: center; gap: calc(var(--u) * .6); }
    .card.add .plus { font-size: calc(var(--u) * 3.4); color: var(--accent); line-height: 1; }
    .card.add small { display: block; font-family: var(--body); font-size: calc(var(--u) * 1.5); line-height: 1; }
    .card.add:hover { border-color: var(--accent); color: #fff; }

    .detail {
      background: var(--panel); border: 3px solid #fff; box-shadow: 0 0 0 3px #000, 8px 8px 0 3px rgba(0,0,0,.5);
      padding: calc(var(--u) * 1.8); display: flex; flex-direction: column; gap: calc(var(--u) * .9); min-height: 0; overflow: hidden;
    }
    .detail h3 { font-family: var(--pixel); font-size: calc(var(--u) * 2); margin: 0; color: var(--accent); text-shadow: 3px 3px 0 #000; line-height: 1.3; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { font-family: var(--pixel); font-size: calc(var(--u) * .85); padding: 6px 8px; border: 2px solid currentColor; color: var(--cyan); }
    .tag.p { color: var(--pink); }
    .detail p { margin: 0; font-size: calc(var(--u) * 1.8); line-height: 1.15; color: #e8e6ff; }
    .detail ul { margin: 0; padding: 0; list-style: none; font-size: calc(var(--u) * 1.6); line-height: 1.3; color: var(--muted); }
    .detail ul li::before { content: '▸ '; color: var(--accent); }
    .romtools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-family: var(--pixel); font-size: calc(var(--u) * .8); color: var(--muted); }
    .romtools select, .romtools button {
      font: inherit; font-size: calc(var(--u) * .85); color: #fff; background: #241c58; border: 2px solid #fff; padding: 6px 8px; cursor: pointer;
    }
    .romtools select { margin-left: 6px; max-width: calc(var(--u) * 20); }
    .romtools button.confirm { background: #e53935; border-color: #000; }
    .detail .push { margin-top: auto; font-family: var(--pixel); font-size: calc(var(--u) * 1); color: var(--accent); }
    .blink { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .2; } }

    /* ---------- rodapé ---------- */
    footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: calc(var(--u) * 1.9); color: var(--muted); }
    .players { display: flex; gap: 10px; align-items: center; }
    .chip {
      font-family: var(--pixel); font-size: calc(var(--u) * .9); padding: 8px 10px; border: 3px solid #000; color: #000;
      box-shadow: 3px 3px 0 rgba(0,0,0,.5); animation: pop .3s;
    }
    .chip.off { opacity: .45; }
    @keyframes pop { from { transform: scale(.4); } }
    .keys b { font-family: var(--pixel); font-size: .55em; color: #000; background: #fff; padding: 3px 6px; margin: 0 4px; }

    /* ---------- transição ao abrir um jogo ---------- */
    #launch {
      position: fixed; inset: 0; z-index: 40; background: #000; display: grid; place-items: center;
      font-family: var(--pixel); font-size: calc(var(--u) * 2.2); color: var(--accent);
      clip-path: circle(0% at 50% 50%); transition: clip-path .45s ease-in;
    }
    #launch.on { clip-path: circle(75% at 50% 50%); }
    #toast {
      position: fixed; left: 50%; top: 18px; transform: translate(-50%, calc(-100% - 40px)); z-index: 45;
      background: #000; border: 3px solid var(--accent); padding: 12px 16px; font-family: var(--pixel); font-size: 11px;
      transition: transform .3s;
    }
    #toast.show { transform: translate(-50%, 0); }

    /* ---------- arrastar ROMs para a tela ---------- */
    #drop {
      position: fixed; inset: 0; z-index: 48; display: none; place-items: center; text-align: center;
      background: rgba(10, 8, 32, .9); border: 8px dashed var(--accent); font-family: var(--pixel); color: var(--accent);
      font-size: calc(var(--u) * 2.4); line-height: 1.8; pointer-events: none;
    }
    #drop.on { display: grid; }
    #drop small { display: block; font-family: var(--body); font-size: .8em; color: var(--muted); }
  </style>
</head>
<body>
  <div class="floor"></div>
  <div class="scan"></div>

  <div class="app">
    <header>
      <h1 class="logo"><span class="w1">PLAYSTATION</span><wbr><span class="w2">BOX</span><span class="w3">360</span><span class="w4">DS</span><small>SEU CELULAR É O CONTROLE</small></h1>
      <div class="join">
        <div class="qr" id="qr"><div class="ph">Conectando...</div></div>
        <div class="txt">
          Escaneie com o app<br>ou a câmera do celular
          <div class="code" id="code">----</div>
          <div class="url" id="url"></div>
        </div>
      </div>
    </header>

    <main>
      <section class="shelf">
        <h2>ESCOLHA UM JOGO</h2>
        <div class="grid" id="grid"></div>
      </section>
      <aside class="detail" id="detail"></aside>
    </main>

    <footer>
      <div class="players" id="players"></div>
      <div class="keys">📂 Arraste ROMs para cá · Celular: setas + JOGAR · Teclado: <b>←→↑↓</b><b>ENTER</b></div>
    </footer>
  </div>

  <div id="launch"></div>
  <div id="toast"></div>
  <div id="drop"><div>📂 SOLTE AS ROMs AQUI<small>NES, SNES, N64, GB/GBC/GBA, DS, Mega Drive, Master System, PS1, fliperama...</small></div></div>
  <input type="file" id="romInput" multiple hidden>

  <script src="/shared/config.js"></script>
  <script src="/shared/arcade-screen.js"></script>
  <script src="/shared/retro-systems.js"></script>
  <script src="/shared/rom-library.js"></script>
  <script src="hub.js"></script>
</body>
</html>
